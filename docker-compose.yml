# ===================================================================
# krasnobaeva — photo & video
# Docker Compose (PHP + Nginx — як у sanya.franya.dev)
# ===================================================================
#
# Схема:
#
#   Internet → Cloudflare → :80 (NPM) → my-test_default → krasnobaeva-web:80
#                                                       ↑
#                                               цей контейнер (nginx:alpine)
#
# КРОКИ:
#   1. cd ~/my-lamp-project/src
#   2. git clone https://github.com/franya1111/n.franya.dev.git
#   3. cd n.franya.dev
#   4. docker compose up -d --build
#   5. В адмінці NPM (http://твій-сервер:81) додай Proxy Host:
#        Domain Names:      n.franya.dev
#        Scheme:             http
#        Forward Hostname:   krasnobaeva-web
#        Forward Port:       80
#        SSL → Request a new SSL Certificate + Force SSL
#
# ОНОВЛЕННЯ КОДУ БЕЗ ПЕРЕЗАГРУЗКИ DOCKER:
#   cd ~/my-lamp-project/src/n.franya.dev
#   git pull
#   → Одразу видно на сайті (opcache.validate_timestamps=1)
#
# ===================================================================

services:
  # ─── Nginx Web Server ───
  nginx:
    image: nginx:alpine
    container_name: krasnobaeva-web
    ports:
      - "80"   # без пробросу назовні — NPM бачить через мережу
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
    networks:
      - krasnobaeva-internal
      - my-test_default

  # ─── PHP-FPM ───
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    container_name: krasnobaeva-php
    volumes:
      - ./:/var/www/html
    restart: unless-stopped
    networks:
      - krasnobaeva-internal

networks:
  krasnobaeva-internal:
    driver: bridge
  # Ця мережа вже існує на твоєму сервері — її створив NPM при установці.
  # Підключаємося як зовнішню, щоб NPM бачив контейнер krasnobaeva-web.
  my-test_default:
    external: true

# ===================================================================
# krasnobaeva — photo & video
# Docker Compose для Nginx Proxy Manager (NPM)
# ===================================================================
#
# Як це працює у твоїй схемі:
#
#   Internet → Cloudflare → :80 (NPM) → my-test_default → krasnobaeva-web:3000
#                                                  ↑
#                                          цей контейнер
#
# Контейнер НЕ пробросжує порт назовні — NPM звертається до нього
# напряму через Docker-мережу my-test_default.
#
# КРОКИ:
#   1. git clone https://github.com/franya1111/n.franya.dev.git
#   2. cd n.franya.dev
#   3. docker compose up -d --build
#   4. В адмінці NPM (http://твій-сервер:81) додай Proxy Host:
#        Domain Names:  n.franya.dev
#        Scheme:        http
#        Forward Hostname: krasnobaeva-web
#        Forward Port:  3000
#        ☑ Block Common Exploits
#        ☑ Websockets Support
#        (SSL tab → Request a new SSL Certificate → ☑ Force SSL)
#
# ===================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krasnobaeva-web
    # НЕ пробрасжуємо порт назовні — NPM звертається напряму через мережу.
    # Якщо дуже треба прямий доступ для дебагу, розкоментуй рядок нижче:
    # ports:
    #   - "3005:3000"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/custom.db
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # SQLite-база зберігається між перезапусками контейнера
      - krasnobaeva-data:/app/data
    restart: unless-stopped
    healthcheck:
      # node:20-alpine не має wget/curl — використовуємо вбудований node
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - krasnobaeva-internal  # внутрішня мережа цього проекту
      - my-test_default       # зовнішня мережа NPM

volumes:
  krasnobaeva-data:
    driver: local

networks:
  krasnobaeva-internal:
    driver: bridge
  # Ця мережа вже існує на твоєму сервері — її створив NPM при установці.
  # Підключаємося як зовнішню, щоб NPM бачив контейнер krasnobaeva-web.
  my-test_default:
    external: true

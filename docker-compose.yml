# ===================================================================
# krasnobaeva — photo & video
# Docker Compose for Cloudflare Tunnel setup
# ===================================================================
#
# Як це працює у твоїй схемі:
#
#   Cloudflare (n.franya.dev) ──► Cloudflare Tunnel ──► http://localhost:${PORT}
#                                                              │
#                                                              ▼
#                                                   Цей docker-контейнер
#
# Один контейнер = один сайт. Ніяких конфліктів портів.
#
# Кроки:
#   1. Склонуй репозиторій у папку піддомену на сервері:
#        git clone https://github.com/franya1111/n.franya.dev.git /var/www/n.franya.dev
#   2. (Опціонально) Зміни порт у .env, якщо 3000 зайнятий:
#        echo "PORT=3001" > .env
#   3. Запусти:
#        docker compose up -d --build
#   4. У конфігу Cloudflare Tunnel вкажи: http://localhost:3000
#      (або той порт, що ти обрав у .env)
#
# ===================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krasnobaeva-web
    # Порт береться з .env (за замовчуванням 3000).
    # Якщо 3000 зайнятий — створи .env з PORT=3001 (або іншим вільним)
    # і вказуй цей же порт у Cloudflare Tunnel.
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/custom.db
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # SQLite-база зберігається між перезапусками контейнера
      - krasnobaeva-data:/app/data
    restart: unless-stopped
    healthcheck:
      # node:20-alpine не має wget/curl — використовуємо вбудований node
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  krasnobaeva-data:
    driver: local

server {
    listen 80 default_server;
    server_name _;

    # Авто-визначення кореня проекту.
    # Працює в обох випадках:
    #   1) ./:/var/www/html (стандарт) → проект у /var/www/html/
    #   2) ../:/var/www/html (батьківська) → проект у /var/www/html/n.franya.dev/
    set $project_root "/var/www/html";
    if (-f /var/www/html/n.franya.dev/index.php) {
        set $project_root "/var/www/html/n.franya.dev";
    }
    root $project_root;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block direct access to data/ directory (JSON files with content)
    location ^~ /data/ {
        deny all;
        return 403;
    }

    # Block access to .git, .env, etc.
    location ~ /\.(git|env|htaccess) {
        deny all;
        return 403;
    }

    # PHP processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Static files caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
